<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1b2130"><meta name="description" content="Hồ sơ tuyệt mật kỉ niệm 3 năm, làm riêng cho Linh.">
  <title>Hồ sơ tuyệt mật · 03 năm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <!-- Intro overlay — no music, click seal to enter -->
  <div id="intro" class="intro-overlay" role="dialog" aria-label="Mở hồ sơ">
    <div class="intro-content">
      <p class="intro-label">Bạn có hồ sơ cần kiểm tra</p>
      <div class="intro-envelope" aria-hidden="false">
        <div class="envelope-body">
          <div class="envelope-flap"></div>
          <div class="envelope-paper">
            <div class="envelope-lines"><i></i><i></i><i></i></div>
          </div>
          <button class="envelope-seal" id="openCase">MỞ<br>HỒ SƠ</button>
        </div>
      </div>
    </div>
    <div class="intro-particles" aria-hidden="true"></div>
  </div>


  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <main id="app" aria-live="polite"></main>
  <footer class="footer"><button id="replayLink" type="button">Làm lại ↺</button></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="config.js?v=6"></script><script src="app.js?v=6"></script>
</body>
</html>
